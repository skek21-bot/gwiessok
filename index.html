<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>귀에쏙</title>
<meta name="description" content="사투리·현장용어·외국어를 들리는 대로 적거나 말하면 쉬운 우리말로 바꿔주는 앱">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#EFF3F1; --surface:#FFFFFF; --surface-2:#E6EDEA;
    --ink:#16231F; --ink-soft:#4C5E58; --muted:#7C8B86;
    --accent:#2F6F62; --accent-ink:#FFFFFF; --accent-soft:#D9ECE6;
    --line:#D7E2DD; --warn:#9A6B2A; --warn-soft:#F6ECDA;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1715; --surface:#16221F; --surface-2:#1C2B27;
      --ink:#E7EFEC; --ink-soft:#AFC2BC; --muted:#7E938C;
      --accent:#6FD6BE; --accent-ink:#0E1715; --accent-soft:#1D3732;
      --line:#2A3B36; --warn:#D7B06B; --warn-soft:#2A2318;
      color-scheme:dark;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Noto Sans KR",system-ui,sans-serif;
    padding:0 16px 48px;
    min-height:100vh;
  }
  .wrap{max-width:560px;margin:0 auto}
  header.top{padding-block:28px 10px}
  header.top h1{font-family:"Gowun Batang",serif; font-size:32px; margin:0 0 6px; letter-spacing:-0.01em}
  header.top p{margin:0; color:var(--ink-soft); font-size:14.5px; line-height:1.55}

  .example{margin-top:16px; padding:14px 16px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line); font-size:13.5px; color:var(--ink-soft); line-height:1.6}
  .example b{color:var(--ink); font-weight:700}
  .example .tag{display:inline-block; font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 9px; margin-right:8px; vertical-align:1px}

  .card{background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:20px; margin-top:16px}

  .chiprow{display:flex; gap:8px; flex-wrap:wrap}
  .chip{font-size:14px; font-weight:600; padding:9px 16px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}

  .langrow{margin-top:10px; display:none; gap:8px; flex-wrap:wrap}
  .langrow.show{display:flex}
  .chip.lang{font-size:13px; padding:7px 13px}

  .custom-lang{margin-top:10px; display:none; width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:14px; font-family:inherit}
  .custom-lang.show{display:block}

  label.field-label{display:block; margin-top:18px; margin-bottom:8px; font-size:13px; font-weight:700; color:var(--ink-soft)}

  textarea{width:100%; min-height:92px; resize:vertical; border-radius:14px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-family:inherit; font-size:16px; line-height:1.55; padding:14px}
  .hint{margin-top:7px; font-size:12.5px; color:var(--muted); line-height:1.5}
  .hint b{color:var(--ink-soft)}

  .btnrow{display:flex; gap:10px; margin-top:16px}
  .micbtn{flex:0 0 auto; width:56px; height:56px; border-radius:16px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); font-size:22px; cursor:pointer; display:flex; align-items:center; justify-content:center}
  .micbtn.listening{background:var(--warn-soft); border-color:var(--warn); animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(154,107,42,.35)}50%{box-shadow:0 0 0 8px rgba(154,107,42,0)}}

  .gobtn{flex:1; padding:14px; border-radius:14px; border:none; background:var(--accent); color:var(--accent-ink); font-size:16px; font-weight:700; cursor:pointer; font-family:inherit; display:flex; align-items:center; justify-content:center; gap:8px}
  .gobtn:disabled{opacity:.6; cursor:default}

  .spinner{width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite; display:none}
  .spinner.show{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}

  .result{margin-top:16px; display:none}
  .result.show{display:block}
  .rescard{background:var(--accent-soft); border:1px solid var(--line); border-radius:16px; padding:18px}
  .rescard .label{font-size:11.5px; font-weight:700; letter-spacing:.04em; color:var(--accent); text-transform:uppercase}
  .rescard .meaning{font-size:19px; font-weight:700; margin-top:6px; line-height:1.5}
  .rescard .guess{margin-top:10px; font-size:13.5px; color:var(--ink-soft)}
  .conf{display:inline-flex; align-items:center; gap:5px; margin-top:12px; font-size:12px; font-weight:700; padding:4px 10px; border-radius:999px}
  .conf.high{background:var(--accent); color:var(--accent-ink)}
  .conf.medium,.conf.low{background:var(--warn-soft); color:var(--warn)}

  .alts{margin-top:14px}
  .alts .altlabel{font-size:12.5px; color:var(--ink-soft); margin-bottom:7px}
  .altchip{display:inline-block; margin:0 6px 6px 0; padding:7px 13px; border-radius:999px; background:var(--surface); border:1px solid var(--line); font-size:13.5px; cursor:pointer}

  .resactions{margin-top:14px; display:flex; gap:8px}
  .minibtn{font-size:13px; font-weight:600; padding:8px 14px; border-radius:10px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); cursor:pointer; font-family:inherit}

  .errbox{margin-top:16px; padding:14px; border-radius:12px; background:var(--warn-soft); color:var(--warn); font-size:13.5px; display:none; line-height:1.5}
  .errbox.show{display:block}

  .histwrap{margin-top:28px}
  .histwrap h2{font-size:14px; color:var(--ink-soft); margin:0 0 10px; font-weight:700}
  .histitem{padding:12px 0; border-top:1px solid var(--line); font-size:13.5px}
  .histitem:first-child{border-top:none}
  .histitem .hi-in{color:var(--ink-soft)}
  .histitem .hi-out{color:var(--ink); font-weight:600; margin-top:3px}
  .histitem .hi-meta{color:var(--muted); font-size:11.5px; margin-top:4px}
  .histempty{color:var(--muted); font-size:13px; padding:4px 0}
  .clearhist{margin-top:10px; font-size:12px; color:var(--muted); background:none; border:none; cursor:pointer; text-decoration:underline; padding:0; font-family:inherit}

  footer.note{margin-top:30px; padding-bottom:10px; font-size:12px; color:var(--muted); line-height:1.6}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>귀에쏙</h1>
    <p>사투리든, 현장 용어든, 외국어든 — 들리는 대로 적거나 말해도 괜찮아요. 쉬운 우리말로 쏙 꽂히게 바꿔드려요.</p>
  </header>

  <div class="example">
    <span class="tag">예시</span>
    경상도 사투리 <b>"정구지 좀 가 와라"</b> → <b>"부추 좀 가져다줘"</b>
  </div>

  <div class="card">
    <label class="field-label">어떤 말인가요?</label>
    <div class="chiprow" id="catRow" role="group" aria-label="카테고리 선택">
      <button class="chip" data-cat="dialect" aria-pressed="true" type="button">사투리·방언</button>
      <button class="chip" data-cat="jargon" aria-pressed="false" type="button">현장 용어</button>
      <button class="chip" data-cat="foreign" aria-pressed="false" type="button">외국어</button>
    </div>

    <div class="langrow" id="langRow" role="group" aria-label="언어 선택">
      <button class="chip lang" data-lang="일본어" type="button">일본어</button>
      <button class="chip lang" data-lang="영어" type="button">영어</button>
      <button class="chip lang" data-lang="중국어" type="button">중국어</button>
      <button class="chip lang" data-lang="베트남어" type="button">베트남어</button>
      <button class="chip lang" data-lang="기타" type="button">기타</button>
    </div>
    <input class="custom-lang" id="customLang" type="text" placeholder="어떤 언어인가요? (예: 태국어)">

    <label class="field-label" for="inputBox">들리는 대로 적어보세요</label>
    <textarea id="inputBox" placeholder="맞춤법 신경 쓰지 말고, 들린 소리 그대로 적어도 돼요."></textarea>
    <div class="hint" id="hintText"><b>Tip.</b> 마이크 버튼을 눌러 말하면 그대로 입력돼요.</div>

    <div class="btnrow">
      <button class="micbtn" id="micBtn" type="button" title="말하기">🎙️</button>
      <button class="gobtn" id="goBtn" type="button">
        <span class="spinner" id="spinner"></span>
        <span id="goLabel">쉬운 말로 바꾸기</span>
      </button>
    </div>

    <div class="errbox" id="errBox"></div>

    <div class="result" id="resultBox">
      <div class="rescard">
        <div class="label">쉬운 뜻</div>
        <div class="meaning" id="resMeaning"></div>
        <div class="guess" id="resGuess"></div>
        <span class="conf" id="resConf"></span>
        <div class="alts" id="resAlts" style="display:none">
          <div class="altlabel">혹시 이거 아니었나요?</div>
          <div id="altChips"></div>
        </div>
        <div class="resactions">
          <button class="minibtn" id="copyBtn" type="button">결과 복사</button>
          <button class="minibtn" id="speakBtn" type="button">🔊 들어보기</button>
        </div>
      </div>
    </div>
  </div>

  <div class="histwrap">
    <h2>최근 변환 기록</h2>
    <div id="histList"><div class="histempty">아직 기록이 없어요.</div></div>
    <button class="clearhist" id="clearHistBtn" type="button" style="display:none">기록 지우기</button>
  </div>

  <footer class="note">
    이 화면에서 입력한 내용은 뜻을 찾는 데만 쓰이고, 기록은 이 기기의 이 브라우저에만 저장돼요. API 키가 필요 없는 무료 엔진을 쓰기 때문에 따로 숨기거나 관리할 키가 없어요.
  </footer>

</div>

<script>
(function(){
  var state = { cat: "dialect", lang: "일본어" };

  var catRow = document.getElementById("catRow");
  var langRow = document.getElementById("langRow");
  var customLang = document.getElementById("customLang");
  var inputBox = document.getElementById("inputBox");
  var hintText = document.getElementById("hintText");
  var micBtn = document.getElementById("micBtn");
  var goBtn = document.getElementById("goBtn");
  var goLabel = document.getElementById("goLabel");
  var spinner = document.getElementById("spinner");
  var errBox = document.getElementById("errBox");
  var resultBox = document.getElementById("resultBox");
  var resMeaning = document.getElementById("resMeaning");
  var resGuess = document.getElementById("resGuess");
  var resConf = document.getElementById("resConf");
  var resAlts = document.getElementById("resAlts");
  var altChips = document.getElementById("altChips");
  var copyBtn = document.getElementById("copyBtn");
  var speakBtn = document.getElementById("speakBtn");
  var histList = document.getElementById("histList");
  var clearHistBtn = document.getElementById("clearHistBtn");

  var EXAMPLES = {
    dialect: { text:"정구지 좀 가 와라", hint:"<b>Tip.</b> 사투리는 맞춤법이 따로 없으니 들린 대로 적어도 돼요." },
    jargon: { text:"가새 좀 가져와", hint:"<b>Tip.</b> 현장에서만 쓰는 줄임말이나 은어도 괜찮아요." },
    foreign: { text:"아리가또", hint:"<b>Tip.</b> 그 나라 말 철자를 몰라도 괜찮아요. 들리는 대로 적어주세요." }
  };

  function setCat(cat){
    state.cat = cat;
    Array.prototype.forEach.call(catRow.querySelectorAll(".chip"), function(b){
      b.setAttribute("aria-pressed", b.dataset.cat === cat ? "true" : "false");
    });
    var showLang = cat === "foreign";
    langRow.className = "langrow" + (showLang ? " show" : "");
    if (!showLang) customLang.classList.remove("show");
    else toggleCustomLang();
    hintText.innerHTML = EXAMPLES[cat].hint;
    if (!inputBox.dataset.touched) inputBox.value = EXAMPLES[cat].text;
  }
  function toggleCustomLang(){ customLang.classList.toggle("show", state.lang === "기타"); }
  function setLang(lang){
    state.lang = lang;
    Array.prototype.forEach.call(langRow.querySelectorAll(".chip"), function(b){
      b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false");
    });
    toggleCustomLang();
  }
  catRow.addEventListener("click", function(e){ var b=e.target.closest(".chip"); if(b) setCat(b.dataset.cat); });
  langRow.addEventListener("click", function(e){ var b=e.target.closest(".chip"); if(b) setLang(b.dataset.lang); });
  inputBox.addEventListener("input", function(){ inputBox.dataset.touched = "1"; });

  setLang("일본어");
  setCat("dialect");

  // ---- 마이크 (브라우저 내장 음성인식 — 실제 배포된 사이트에서는 정상 동작) ----
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var recognizing = false;
  if (!SR){
    micBtn.disabled = true;
    micBtn.title = "이 브라우저는 음성 입력을 지원하지 않아요";
    micBtn.style.opacity = "0.4";
  } else {
    var rec = new SR();
    rec.lang = "ko-KR";
    rec.interimResults = false;
    rec.maxAlternatives = 1;
    micBtn.addEventListener("click", function(){
      if (recognizing){ rec.stop(); return; }
      try { rec.start(); recognizing = true; micBtn.classList.add("listening"); }
      catch(e){}
    });
    rec.onresult = function(e){
      var spoken = e.results[0][0].transcript;
      inputBox.value = spoken;
      inputBox.dataset.touched = "1";
    };
    rec.onerror = function(){ recognizing = false; micBtn.classList.remove("listening"); };
    rec.onend = function(){ recognizing = false; micBtn.classList.remove("listening"); };
  }

  function extractJsonSafely(raw){
    if (!raw) return null;
    var m = String(raw).match(/\{[\s\S]*\}/);
    if (!m) return null;
    try { return JSON.parse(m[0]); } catch(e){ return null; }
  }

  function buildPrompt(){
    var text = inputBox.value.trim();
    var langName = state.lang === "기타" ? (customLang.value.trim() || "알 수 없는 외국어") : state.lang;
    var domain;
    if (state.cat === "dialect"){
      domain = "다음은 한국어 지역 방언(사투리)으로 추정되는 표현입니다. 사용자는 귀로 들은 소리를 그대로 적었을 수 있어 맞춤법, 띄어쓰기, 받침이 정확하지 않을 수 있습니다. 소리가 비슷한 사투리 단어를 유연하게 추정해서 해석하세요.";
    } else if (state.cat === "jargon"){
      domain = "다음은 건설·제조 등 특정 업종 현장에서 쓰는 전문용어, 줄임말 또는 은어로 추정되는 표현입니다. 표기가 정확하지 않을 수 있으니 유연하게 추정해서 해석하세요.";
    } else {
      domain = "다음은 사용자가 " + langName + " 단어나 표현의 발음을 귀로 듣고 한국어 발음 그대로 한글로 받아 적은 것입니다. " + langName + " 맞춤법을 전혀 모를 수 있으니, 비슷하게 들리는 " + langName + " 표현을 유연하게 추정하세요.";
    }
    return domain + "\n\n입력: \"" + text + "\"\n\n" +
      "위 표현의 뜻을 이해하기 쉬운 한국어 표준어로 설명하세요. 반드시 아래 JSON 형식으로만, 다른 설명 없이 응답하세요.\n" +
      "{\n" +
      '  "guess": "가장 가능성 높은 원래 표현(사투리/현장용어/외국어 원문)",\n' +
      '  "meaning": "쉬운 한국어로 풀어쓴 뜻 (한두 문장)",\n' +
      '  "confidence": "high 또는 medium 또는 low 중 하나",\n' +
      '  "alternatives": ["확신이 낮을 때 고려할 만한 다른 후보 뜻, 최대 3개, 없으면 빈 배열"]\n' +
      "}";
  }

  // 무료 엔진(Pollinations) — API 키가 필요 없어 숨길 키 자체가 없음
  async function callAi(prompt){
    var ctrl = new AbortController();
    var tid = setTimeout(function(){ ctrl.abort(); }, 12000);
    try {
      var res = await fetch("https://text.pollinations.ai/openai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "openai",
          messages: [
            { role: "system", content: "당신은 사투리, 현장 용어, 외국어 발음을 쉬운 한국어로 풀어주는 도우미입니다. 사용자의 표기가 정확하지 않아도 유연하게 추정합니다." },
            { role: "user", content: prompt }
          ]
        }),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      var data = await res.json();
      var content = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : "";
      var parsed = extractJsonSafely(content);
      if (!parsed || !parsed.meaning) throw new Error("파싱 실패");
      return parsed;
    } finally {
      clearTimeout(tid);
    }
  }

  function confLabel(c){
    if (c === "high") return "확실해요";
    if (c === "medium") return "아마 맞을 거예요";
    return "확신이 낮아요";
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  var lastMeaning = "";
  function renderResult(data, rawMeta){
    errBox.classList.remove("show");
    resMeaning.textContent = data.meaning || "뜻을 찾지 못했어요.";
    lastMeaning = data.meaning || "";
    resGuess.innerHTML = data.guess ? ("추정 원래 표현: <b>" + escapeHtml(data.guess) + "</b>") : "";
    var conf = (data.confidence || "medium").toLowerCase();
    if (["high","medium","low"].indexOf(conf) === -1) conf = "medium";
    resConf.textContent = confLabel(conf);
    resConf.className = "conf " + conf;

    var alts = Array.isArray(data.alternatives) ? data.alternatives.filter(Boolean).slice(0,3) : [];
    if (alts.length && conf !== "high"){
      altChips.innerHTML = "";
      alts.forEach(function(a){
        var chip = document.createElement("span");
        chip.className = "altchip";
        chip.textContent = a;
        chip.addEventListener("click", function(){ resMeaning.textContent = a; lastMeaning = a; });
        altChips.appendChild(chip);
      });
      resAlts.style.display = "block";
    } else {
      resAlts.style.display = "none";
    }
    resultBox.classList.add("show");
    addHistory(rawMeta, data);
  }

  function showError(msg){
    errBox.textContent = msg;
    errBox.classList.add("show");
    resultBox.classList.remove("show");
  }

  goBtn.addEventListener("click", async function(){
    var text = inputBox.value.trim();
    if (!text){ showError("먼저 뜻을 알고 싶은 말을 적어주세요."); return; }
    goBtn.disabled = true;
    spinner.classList.add("show");
    goLabel.textContent = "찾아보는 중...";
    errBox.classList.remove("show");
    try {
      var data = await callAi(buildPrompt());
      renderResult(data, { cat: state.cat, lang: state.lang === "기타" ? (customLang.value.trim()||"기타") : state.lang, text: text });
    } catch(err){
      showError("지금 뜻을 찾는 데 문제가 생겼어요. 인터넷 연결을 확인하시고 다시 시도해주세요.");
    } finally {
      goBtn.disabled = false;
      spinner.classList.remove("show");
      goLabel.textContent = "쉬운 말로 바꾸기";
    }
  });

  copyBtn.addEventListener("click", async function(){
    try { await navigator.clipboard.writeText(lastMeaning); copyBtn.textContent = "복사됨!"; }
    catch(e){ copyBtn.textContent = "복사 실패"; }
    setTimeout(function(){ copyBtn.textContent = "결과 복사"; }, 1600);
  });

  speakBtn.addEventListener("click", function(){
    if (!lastMeaning || !("speechSynthesis" in window)) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(lastMeaning);
      u.lang = "ko-KR";
      window.speechSynthesis.speak(u);
    } catch(e){}
  });

  // ---- 히스토리 (이 기기에만 저장) ----
  var HKEY = "ggmm_history_v1";
  function loadHistory(){ try { var raw = localStorage.getItem(HKEY); return raw ? JSON.parse(raw) : []; } catch(e){ return []; } }
  function saveHistory(list){ try { localStorage.setItem(HKEY, JSON.stringify(list.slice(0,20))); } catch(e){} }
  function catLabel(c){ return c === "dialect" ? "사투리" : c === "jargon" ? "현장용어" : "외국어"; }
  function renderHistory(){
    var list = loadHistory();
    if (!list.length){ histList.innerHTML = '<div class="histempty">아직 기록이 없어요.</div>'; clearHistBtn.style.display = "none"; return; }
    histList.innerHTML = "";
    list.forEach(function(h){
      var item = document.createElement("div");
      item.className = "histitem";
      var metaBits = [catLabel(h.meta.cat)];
      if (h.meta.cat === "foreign") metaBits.push(h.meta.lang);
      item.innerHTML =
        '<div class="hi-in">"' + escapeHtml(h.meta.text) + '"</div>' +
        '<div class="hi-out">' + escapeHtml(h.data.meaning || "") + '</div>' +
        '<div class="hi-meta">' + metaBits.join(" · ") + "</div>";
      histList.appendChild(item);
    });
    clearHistBtn.style.display = "inline-block";
  }
  function addHistory(meta, data){
    var list = loadHistory();
    list.unshift({ meta: meta, data: data, t: Date.now() });
    saveHistory(list);
    renderHistory();
  }
  clearHistBtn.addEventListener("click", function(){ try { localStorage.removeItem(HKEY); } catch(e){} renderHistory(); });
  renderHistory();
})();
</script>
</body>
</html>
